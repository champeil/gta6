<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Solara Bay — an open-world crime story</title>
    <meta
      name="description"
      content="Solara Bay: a top-down open-world crime game. Seven jobs for two fixers, Sun Cab fares, courier parcels, and a five-star police response across six quarters of a sun-bleached bay."
    />
    <style>
      :root {
        color-scheme: dark;
        --paper: #f6efe1;
        --night: #080b11;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--night);
        color: var(--paper);
        font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
        cursor: crosshair;
        touch-action: none;
        outline: none;
      }
      #status {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
      noscript {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 40px;
        text-align: center;
        font-size: 18px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="1280" height="800" aria-label="Solara Bay, seen from above"></canvas>
    <p id="status" role="status" aria-live="polite">Loading Solara Bay…</p>
    <noscript>
      Solara Bay draws itself with JavaScript and a canvas. This browser has one of those switched off, so there is
      nothing to show — turn scripts back on and reload.
    </noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
